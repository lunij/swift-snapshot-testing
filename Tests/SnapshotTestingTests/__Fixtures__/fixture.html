<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snapshot Testing Fixture</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #121212;
    }
    header {
      background: #121212;
      color: #ffffff;
      padding: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 32px;
    }
    main {
      padding: 24px;
    }
    .swatches {
      display: flex;
    }
    .swatch {
      width: 120px;
      height: 80px;
      margin-right: 16px;
      border: 4px solid #121212;
    }
    .green { background: #79f2b0; }
    .blue { background: #4cccff; }
    .yellow { background: #fff080; }
    /* Styles the element injected by the DOM-manipulation snapshot test. */
    #banner {
      background: #fff080;
      border: 4px solid #121212;
      margin: 24px;
      padding: 24px;
      font-size: 24px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Snapshot Testing Fixture</h1>
  </header>
  <main>
    <p>A small, self-contained page for web view snapshot tests. It references no remote resources.</p>
    <div class="swatches">
      <div class="swatch green"></div>
      <div class="swatch blue"></div>
      <div class="swatch yellow"></div>
    </div>
  </main>
</body>
</html>
