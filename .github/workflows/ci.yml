name: CI

on:
  push:

jobs:
  macos:
    strategy:
      matrix:
        xcode:
          - '16.4'

    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Run tests
        id: run-tests
        run: make test-macos
      - name: Zip XCResult
        id: zip-xcresult
        if: failure() && steps.run-tests.conclusion == 'failure'
        run: cd .xcresults; zip -r xcresult-macos.zip macos.xcresult
      - name: Upload XCResult
        if: failure() && steps.zip-xcresult.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-macos.zip
          path: .xcresults/xcresult-macos.zip

  ubuntu:
    strategy:
      matrix:
        swift:
          - '6.1'

    container: swift:${{ matrix.swift }}
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test

  android:
    strategy:
      matrix:
        swift:
          - "6.2"
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: ${{ matrix.swift }}
          copy-files: ${GITHUB_WORKSPACE}/Tests/SnapshotTestingTests/__Snapshots__
